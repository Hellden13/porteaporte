<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmer le pickup — PorteàPorte</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/brand-uniform.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--brand-bg); padding: 20px; }
    .card { background: var(--brand-surface); border: 1px solid var(--brand-border); border-radius: 16px; padding: 32px 28px; max-width: 420px; width: 100%; text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; font-weight: 900; color: var(--brand-fg); margin: 0 0 8px; }
    .sub { color: var(--brand-muted); font-size: .9rem; margin-bottom: 24px; }
    .detail { background: rgba(93,191,255,.06); border: 1px solid rgba(93,191,255,.2); border-radius: 10px; padding: 16px; text-align: left; margin-bottom: 24px; }
    .detail-row { display: flex; justify-content: space-between; font-size: .88rem; padding: 4px 0; }
    .detail-label { color: var(--brand-muted); }
    .detail-val { color: var(--brand-fg); font-weight: 700; }
    .btn { width: 100%; background: var(--brand-lime); color: var(--brand-ink); border: none; padding: 16px; font-size: 1rem; font-weight: 900; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: .9rem; padding: 12px; border-radius: 8px; }
    .msg.ok { background: rgba(120,217,0,.1); color: #7de47d; }
    .msg.err { background: rgba(255,90,90,.1); color: #ffb0b0; }
    #loading { color: var(--brand-muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Confirmer la récupération</h1>
    <p class="sub">Scannez ce QR pour confirmer que vous avez récupéré le colis.</p>
    <div id="loading">Chargement…</div>
    <div id="details" style="display:none">
      <div class="detail" id="detail-box"></div>
      <button class="btn" id="confirm-btn" onclick="confirmPickup()">✅ Confirmer la récupération</button>
      <div id="msg" class="msg" style="display:none"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://miqrircrfpzkmvvacgwt.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pcXJpcmNyZnB6a212dmFjZ3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU2MTE5NjgsImV4cCI6MjA2MTE4Nzk2OH0.KBMDelMvFj3GkWGxBD5uSZL_9vCXHPKJPaJkNSHY0mk';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const params = new URLSearchParams(window.location.search);
    const livraisonId = params.get('id');
    let session = null;

    async function init() {
      if (!livraisonId) {
        document.getElementById('loading').textContent = '❌ Identifiant de livraison manquant.';
        return;
      }

      const { data } = await db.auth.getSession();
      if (!data?.session) {
        window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      session = data.session;

      const res = await fetch('/api/tracking?code=' + encodeURIComponent(livraisonId), {
        headers: { Authorization: 'Bearer ' + session.access_token }
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.livraison) {
        document.getElementById('loading').textContent = '❌ ' + (out.error || 'Livraison introuvable.');
        return;
      }

      const liv = out.livraison;
      if (liv.livreur_id !== session.user.id) {
        document.getElementById('loading').textContent = '❌ Vous n\'êtes pas le livreur assigné à cette livraison.';
        return;
      }

      document.getElementById('detail-box').innerHTML = `
        <div class="detail-row"><span class="detail-label">Référence</span><span class="detail-val">${liv.code || livraisonId.slice(0,8)}</span></div>
        <div class="detail-row"><span class="detail-label">Trajet</span><span class="detail-val">${liv.ville_depart || '?'} → ${liv.ville_arrivee || '?'}</span></div>
        <div class="detail-row"><span class="detail-label">Type</span><span class="detail-val">${liv.type_colis || 'Colis'}</span></div>
        <div class="detail-row"><span class="detail-label">Statut actuel</span><span class="detail-val">${liv.statut}</span></div>
      `;

      if (['ramasse', 'livre', 'payee'].includes(liv.statut)) {
        document.getElementById('confirm-btn').disabled = true;
        document.getElementById('confirm-btn').textContent = '✅ Déjà récupéré';
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('details').style.display = 'block';
    }

    async function confirmPickup() {
      const btn = document.getElementById('confirm-btn');
      const msgEl = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Confirmation…';
      msgEl.style.display = 'none';

      try {
        const res = await fetch('/api/platform?endpoint=pickup-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ livraison_id: livraisonId })
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || 'Erreur confirmation');

        msgEl.className = 'msg ok';
        msgEl.textContent = '✅ Colis récupéré ! L\'expéditeur a été notifié. Bonne route !';
        msgEl.style.display = 'block';
        btn.textContent = '✅ Récupéré';
        setTimeout(() => { window.location.href = '/dashboard-livreur.html'; }, 2500);
      } catch (err) {
        msgEl.className = 'msg err';
        msgEl.textContent = '❌ ' + err.message;
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '✅ Confirmer la récupération';
      }
    }

    init();
  </script>
</body>
</html>
