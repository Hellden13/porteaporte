<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — PorteàPorte</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/brand-uniform.css">
  <link rel="stylesheet" href="/assets/a11y.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <style>
    body { margin:0; background:#05080c; color:var(--brand-text); font-family:Inter,system-ui,sans-serif; }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
    .card { width:100%; max-width:440px; padding:36px; box-sizing:border-box; background:var(--brand-bg-surface); border:1px solid var(--brand-border); border-radius:16px; box-shadow:0 8px 48px rgba(0,0,0,.5); }
    .brand { display:block; margin-bottom:26px; color:var(--brand-lime); text-align:center; font-size:22px; font-weight:900; text-decoration:none; }
    h1 { margin:0 0 10px; font-size:1.7rem; }
    p { color:var(--brand-muted); line-height:1.5; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input { width:100%; box-sizing:border-box; padding:12px 14px; color:var(--brand-text); background:var(--brand-bg-dark); border:1px solid var(--brand-border); border-radius:8px; font-size:16px; }
    input:focus { outline:2px solid var(--brand-cyan); outline-offset:1px; }
    button { width:100%; margin-top:22px; padding:13px; background:var(--brand-lime); color:#071006; border:0; border-radius:9px; font-weight:900; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .status { display:none; margin-top:16px; padding:12px; border-radius:8px; line-height:1.45; }
    .status.error { display:block; color:#ffb3b3; background:rgba(255,90,90,.1); border:1px solid rgba(255,90,90,.35); }
    .status.success { display:block; color:#b8f53e; background:rgba(184,245,62,.08); border:1px solid rgba(184,245,62,.3); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <a class="brand" href="/">PorteàPorte</a>
      <h1>Choisis ton nouveau mot de passe</h1>
      <p>Utilise au moins 10 caractères, dont une lettre et un chiffre.</p>
      <form id="reset-form">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{10,}" required>
        <label for="password-confirm">Confirme le mot de passe</label>
        <input id="password-confirm" type="password" autocomplete="new-password" minlength="10" required>
        <button id="submit" type="submit">Enregistrer mon nouveau mot de passe</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const db = window.getSupabaseClient ? window.getSupabaseClient() : window.db;
    const form = document.getElementById('reset-form');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');

    function show(message, type) {
      status.textContent = message;
      status.className = 'status ' + type;
    }

    async function verifyRecoverySession() {
      const { data } = await db.auth.getSession();
      if (!data?.session) {
        form.style.display = 'none';
        show('Ce lien est invalide ou expiré. Retourne à la connexion pour demander un nouveau lien.', 'error');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('password-confirm').value;
      if (password !== confirmation) {
        show('Les deux mots de passe ne correspondent pas.', 'error');
        return;
      }
      if (password.length < 10 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
        show('Le mot de passe doit contenir au moins 10 caractères, une lettre et un chiffre.', 'error');
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Enregistrement…';
      const { error } = await db.auth.updateUser({ password });
      if (error) {
        show(error.message || 'Impossible de modifier le mot de passe.', 'error');
        submit.disabled = false;
        submit.textContent = 'Enregistrer mon nouveau mot de passe';
        return;
      }
      form.style.display = 'none';
      show('Mot de passe modifié avec succès. Redirection vers ton compte…', 'success');
      setTimeout(() => { window.location.href = '/login.html'; }, 1800);
    });

    verifyRecoverySession();
  </script>
</body>
</html>
